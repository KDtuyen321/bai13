<body>
    <!-- Hãy thực hiện cho người dùng nhập vào dãy số bất kỳ.
      Sử dụng split() để chuyển đổi kiểu dữ liệu từ string sang kiểu array.
      Tiến hành duyệt các phần tử và tìm ra phần tử có giá trị lớn nhất trong 
      mảng và thực hiện in ra màn hình bằng alert() -->
      <script>
       let string = prompt('Nhập vào chuỗi số: ');
       let array=string.split("")
let max = Number(array[0]);
for (let i = 1; i < array.length; i++) {
  if (max < Number(array[i])) {
    max = Number(array[i]);
  }
}
console.log(`Giá trị lớn nhất = ${max}`);
            

      </script>
</body>
